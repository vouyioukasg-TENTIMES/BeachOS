name: Decision proposal
description: Propose a significant product or engineering decision
title: "[Decision]: "
labels: [decision, proposed]
body:
  - type: textarea
    id: decision
    attributes:
      label: Proposed decision
      description: State the choice clearly.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain the problem, constraints, and relevant evidence.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: reasoning
    attributes:
      label: Why this option
    validations:
      required: true
  - type: textarea
    id: consequences
    attributes:
      label: Consequences and review trigger
    validations:
      required: true
