name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate repository bootstrap
        run: ./scripts/check-foundation.sh

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
      - name: Enable Corepack
        run: corepack enable && corepack prepare pnpm@10.12.4 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: beachos_test
          POSTGRES_USER: beachos_test
          POSTGRES_PASSWORD: beachos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beachos_test -d beachos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BEACHOS_TEST_DATABASE_URL: >-
        postgresql://beachos_test:beachos_test@localhost:5432/beachos_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13.14
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Lint and format-check
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy src tests
      - name: Test
        run: uv run pytest
      - name: Build
        run: uv build
